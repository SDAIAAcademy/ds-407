    "numpy>=2.0",
    "pandas>=2.2",
    "jupyterlab>=4.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
