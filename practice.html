<section>
<h2>Day 1: Set the standard</h2>
<ol>
<li><p>N4: mean import dwell by quarter, one source, a method the unit runs every month. It goes into the authority's published annual statistics. With the matrix and escalators on the earlier slides, what level?</p><ul><li><b>A.</b> Level 1: the method is simple</li><li><b>B.</b> Level 2: medium effect, low complexity</li><li><b>C.</b> Level 3: level 2 from the matrix, plus one for public release</li><li><b>D.</b> Level 4: anything public gets the highest level</li></ul></li>
<li><p>Your checklist must stay short at level 1, the self-check that most dashboard requests get. Which of these items is required from level 1?</p><ul><li><b>A.</b> The output is free of personal data and its classification is marked</li><li><b>B.</b> The model is tested on data it never saw</li><li><b>C.</b> A reviewer re-runs it from the repository</li><li><b>D.</b> Every number has an interval</li></ul></li>
<li><p>A re-run of a colleague's repository meets four problems. Which one most threatens the quality of what the unit releases?</p><ul><li><b>A.</b> The script crashes on a missing file</li><li><b>B.</b> An old library call fails with an error</li><li><b>C.</b> The README names the wrong file</li><li><b>D.</b> A step done by hand that no file records</li></ul></li>
<li><p>An analyst pastes the night pilot roster, with pilots' names and shifts, into the authority's approved hosted assistant to find fatigue risks. She plans to disclose it and re-run every number. Under the rules, what is it?</p><ul><li><b>A.</b> Allowed: the tool is approved</li><li><b>B.</b> A breach: restricted data may not go to the assistant</li><li><b>C.</b> Allowed once the deliverable is disclosed</li><li><b>D.</b> Needs action: re-run the numbers first</li></ul></li>
<li><p>A request: monthly tug fuel use per call, from one system, for an internal note that nobody acts on for at least a quarter. With the unit's matrix (effect by complexity) and its escalators, which level does it get?</p><ul><li><b>A.</b> Level 1: a low effect and a low complexity</li><li><b>B.</b> Level 2: every analysis needs a second pair of eyes</li><li><b>C.</b> Level 3: fuel is a cost, and costs go to the board</li><li><b>D.</b> Level 2: the data come from an operational system</li></ul></li>
<li><p>Two analysts grade the same request with your written standard. One gives level 2, the other level 3. Both used the matrix correctly. What does the difference most likely show?</p><ul><li><b>A.</b> One analyst is more careful than the other</li><li><b>B.</b> A definition in the standard can be read two ways</li><li><b>C.</b> The matrix has too few levels to be useful</li><li><b>D.</b> The request should go to the head of unit to decide</li></ul></li>
<li><p>In a unit of twelve, the analyst who built the berth demand model is also the most senior person free to assure it. Under the four roles, what should happen?</p><ul><li><b>A.</b> He assures it, since he knows the model best</li><li><b>B.</b> He approves it, and a junior analyst assures it</li><li><b>C.</b> Another senior assures it, even if that waits a week</li><li><b>D.</b> The commissioner assures it, as the person who asked</li></ul></li>
<li><p>You adapt a published 32-item checklist written for machine-learning studies. Most of the unit's work is counts and comparisons for directors. What is the best first step?</p><ul><li><b>A.</b> Adopt all 32 items as they stand, so that nothing the authors found is missed</li><li><b>B.</b> Use it only for level 4 analyses</li><li><b>C.</b> Replace it with one question: is the work reproducible?</li><li><b>D.</b> Map the items to the review areas and keep those the unit's work needs</li></ul></li>
<li><p>Which checklist item can two reviewers answer the same way?</p><ul><li><b>A.</b> Are excluded records counted, with a reason for each exclusion?</li><li><b>B.</b> Is the analysis rigorous?</li><li><b>C.</b> Is the data quality good enough?</li><li><b>D.</b> Would an experienced expert in the field approve of the method used?</li></ul></li>
<li><p>A level 1 dashboard request is checked by its analyst. Which item must the self-check still include?</p><ul><li><b>A.</b> An independent re-run of the analysis from its repository</li><li><b>B.</b> No personal data and the classification marked</li><li><b>C.</b> An interval on every number</li><li><b>D.</b> A second reviewer's severity ratings</li></ul></li>
<li><p>A colleague's script runs to the end on your laptop and prints 5.18 days; the report says 4.60. Nothing failed. What do you do next?</p><ul><li><b>A.</b> Accept the report: the code ran without errors</li><li><b>B.</b> Accept your figure and correct the report</li><li><b>C.</b> Look for a step that happened outside the code</li><li><b>D.</b> Average the two figures and note the range</li></ul></li>
<li><p>Two runs of the same script give 5.08 and 5.17. Which repository rule prevents this?</p><ul><li><b>A.</b> Pin every package version in a lock file</li><li><b>B.</b> Use only relative paths</li><li><b>C.</b> Name every input file and its source in the README</li><li><b>D.</b> Fix the seed of every random step in the code</li></ul></li>
<li><p>True or false: a reviewer should read the report first, so that the re-run can focus on the claims that matter.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>An analyst uses the approved assistant on anonymised berth data, keeps the prompts, and re-runs every number, but the board paper has no line saying an assistant was used. Under the rules, what is it?</p><ul><li><b>A.</b> A breach of the disclosure rule</li><li><b>B.</b> Allowed: the data and the verification were right</li><li><b>C.</b> Allowed, if the reviewer knew about it</li><li><b>D.</b> A breach of the data rule</li></ul></li>
<li><p>Which rule can a reviewer check from the files of an analysis?</p><ul><li><b>A.</b> Use the assistant responsibly</li><li><b>B.</b> Keep a verification record of each assisted number</li><li><b>C.</b> Be transparent with readers about any use of AI in the work</li><li><b>D.</b> Protect sensitive data where possible</li></ul></li>
<li><p>Why does the unit's rule set include one analysis a quarter done without an assistant?</p><ul><li><b>A.</b> To measure how much time the assistant saves</li><li><b>B.</b> Because the national guidelines forbid assistants for analysis</li><li><b>C.</b> To keep the skill needed to check the assistant</li><li><b>D.</b> To give the reviewers a lighter quarter</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Review and develop</h2>
<ol>
<li><p>Four requests and the level an analyst gave each, with the unit's matrix and escalators. Which one is graded right?</p><ul><li><b>A.</b> A model that sets night pilot numbers: level 2, it is a simple regression</li><li><b>B.</b> A staff survey summary with personal data: level 3</li><li><b>C.</b> A dwell figure for the ministry's indicators: level 2</li><li><b>D.</b> A tariff revenue estimate for the board: level 3</li></ul></li>
<li><p>Two reviewers rate 20 findings and agree on 16 of them, 80%. Their weighted kappa is 0.3. Which explanation fits?</p><ul><li><b>A.</b> The kappa was computed wrongly</li><li><b>B.</b> Most findings were rated minor by both, so much of the agreement was expected by chance</li><li><b>C.</b> Four disagreements are too many for any team</li><li><b>D.</b> Twenty findings are too few to compute kappa</li></ul></li>
<li><p>An analyst's assisted analysis has a disclosure line and correct figures when you recompute them, but no prompts and no verification record. He says he checked everything. What does the audit record?</p><ul><li><b>A.</b> No breach: the figures are right</li><li><b>B.</b> A breach of the disclosure rule</li><li><b>C.</b> A breach of the keep rules: no prompts and no record</li><li><b>D.</b> A breach of the verify rule only</li></ul></li>
<li><p>Four feedback notes on the same finding: an average that mixed imports with transshipment.</p><ul><li><b>A.</b> Cell 3 averages imports with transshipment (5.2 days); print counts by move type before every average</li><li><b>B.</b> Be more careful with the populations you average over</li><li><b>C.</b> Your dwell figure was wrong because of transshipment</li><li><b>D.</b> Read the unit's data-handling guide again this month</li></ul></li>
<li><p>Next quarter's level 3 and 4 reviews need 184 senior hours; your seniors have 150. A director asks you to "just call some of them level 2".</p><ul><li><b>A.</b> Lower five level 3 analyses to level 2</li><li><b>B.</b> Ask the seniors to absorb the extra hours</li><li><b>C.</b> Let mid-level analysts review level 3 alone</li><li><b>D.</b> Co-sign five level 3 reviews and defer what can wait</li></ul></li>
<li><p>A draft names vessel masters and their mobile numbers in a table. Fixing it changes no figure and no recommendation. Under the unit's severity scale, how is it rated?</p><ul><li><b>A.</b> Not a finding: it is the data protection officer's matter</li><li><b>B.</b> Minor: it is presentation, like a label</li><li><b>C.</b> Major: personal data is serious but the decision stands</li><li><b>D.</b> Critical: the output cannot leave the unit as it is</li></ul></li>
<li><p>Fixing one flaw moves an estimated effect from -5.36 hours to -1.37; the draft recommends action only at -2 hours or more. Fixing a second flaw moves it on to -0.94. How do the two flaws rate?</p><ul><li><b>A.</b> First critical, second major</li><li><b>B.</b> First major, second critical: the second leaves the smaller effect</li><li><b>C.</b> Both critical: both move the estimate</li><li><b>D.</b> Both major: neither alone gives the final figure</li></ul></li>
<li><p>Two reviewers rate the same six findings and differ by two levels on one of them. What should the calibration session produce?</p><ul><li><b>A.</b> An average of the two ratings for that finding</li><li><b>B.</b> A sentence added to the checklist that would have prevented the gap</li><li><b>C.</b> A note in the review file that the two reviewers see the finding differently</li><li><b>D.</b> The senior reviewer's rating, recorded as final</li></ul></li>
<li><p>An assisted analysis used the approved assistant, re-ran every number and disclosed the use. The data sent to the assistant were the names and shifts of pilots. What does the audit record?</p><ul><li><b>A.</b> No breach: the work was verified and disclosed</li><li><b>B.</b> A breach of the disclosure rule, since the pilots were never told their data were used</li><li><b>C.</b> A breach of the data rule; tell the data protection officer and redo on anonymised data</li><li><b>D.</b> A minor note for the analyst's feedback</li></ul></li>
<li><p>An assisted analysis reports 18.4% and has no verification record. You recompute 47.7% from the authority's data. What action does the audit table record?</p><ul><li><b>A.</b> Correct the figure to 47.7% in the released paper and tell its readers</li><li><b>B.</b> Ask the analyst to add a verification record</li><li><b>C.</b> Note it for the next quarter's audit</li><li><b>D.</b> Withdraw the figure, then re-run and re-review the analysis</li></ul></li>
<li><p>An audit of five assisted analyses finds two with no verification record. What is the best change to propose?</p><ul><li><b>A.</b> No review of assisted work starts without its verification record</li><li><b>B.</b> Warn the two analysts in writing</li><li><b>C.</b> Ban the assistant until the next audit</li><li><b>D.</b> Audit every assisted analysis from now on, not a sample of five</li></ul></li>
<li><p>A reviewer found seven things in a new analyst's notebook, from a missing comparison group to variable names. How many should the feedback conversation raise?</p><ul><li><b>A.</b> All seven of them, so that nothing is hidden from her</li><li><b>B.</b> About three that show a pattern in her reasoning</li><li><b>C.</b> None: send the review notes instead</li><li><b>D.</b> Only the most severe one</li></ul></li>
<li><p>Which part of a feedback note does most to build an analyst's skill on a new problem?</p><ul><li><b>A.</b> The observation: the cell and the number</li><li><b>B.</b> The effect of the error on the decision the analysis informed</li><li><b>C.</b> The reasoning: the question she did not ask herself</li><li><b>D.</b> The praise that opens the note</li></ul></li>
<li><p>A new analyst's lowest skill is verifying assisted work. Why does her three-month plan end with an analysis done without the assistant?</p><ul><li><b>A.</b> To measure how fast she is without it</li><li><b>B.</b> Because juniors may not use the assistant</li><li><b>C.</b> To give her reviewer a simpler analysis</li><li><b>D.</b> She cannot check work she cannot do herself</li></ul></li>
<li><p>Level 3 reviews take 10 senior hours and level 4 reviews 16, plus a second reviewer. Next quarter has 12 level 3 and 4 level 4 analyses. How many senior hours do they need?</p><ul><li><b>A.</b> 184 hours</li><li><b>B.</b> 152 hours</li><li><b>C.</b> 120 hours</li><li><b>D.</b> 216 hours</li></ul></li>
<li><p>A co-signed level 3 review has a mid-level analyst review and a senior check the review in 2 hours, in place of 10. How many co-signed reviews close a senior shortfall of 34 hours?</p><ul><li><b>A.</b> Four</li><li><b>B.</b> Five</li><li><b>C.</b> Seventeen</li><li><b>D.</b> Three</li></ul></li>
<li><p>True or false: a rota where two seniors end at 100% of their review hours is ready for the quarter.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Work with sponsors</h2>
<ol>
<li><p>You and a colleague reviewed the same analysis alone. You agree on three of six severity ratings; the largest gap, two levels, is on a privacy finding.</p><ul><li><b>A.</b> Record a severity of 2 for the privacy finding</li><li><b>B.</b> Use the senior reviewer's ratings</li><li><b>C.</b> Discuss the privacy gap and add the sentence to the checklist that prevents it</li><li><b>D.</b> Discuss all three disagreements in turn</li></ul></li>
<li><p>You agreed option A, 4.0 days with review. The sponsor now says four days, and adds a question on feeder vessels. What do you answer?</p><ul><li><b>A.</b> Keep A and add the feeder question; the team will work longer</li><li><b>B.</b> Offer B in place of A: it fits four days and answers the feeder question</li><li><b>C.</b> Drop the review to level 2 so everything fits</li><li><b>D.</b> Say the deadline cannot be met and ask for a later board</li></ul></li>
<li><p>With three months of data after the change, the minimum detectable change is 1.13 hours. The sponsor wants to extend "if waiting falls by half an hour". What do you do?</p><ul><li><b>A.</b> Sign it: the sponsor sets the threshold</li><li><b>B.</b> Use a looser test so half an hour can show</li><li><b>C.</b> Run the analysis first, then agree the threshold</li><li><b>D.</b> Show him the detectable change and agree a longer window or a threshold the data can test</li></ul></li>
<li><p>You checked the subgroup: hundreds of cases, a large effect, and its condition is in the signed decision rule. The deputy chief executive asks again to remove it. What do you do?</p><ul><li><b>A.</b> Remove it and mention it in a footnote</li><li><b>B.</b> Remove it, since he outranks you</li><li><b>C.</b> Keep it, record the repeated request and escalate with the record</li><li><b>D.</b> Keep it, but leave the request out of the record</li></ul></li>
<li><p>A released figure is found to be wrong; the corrected value is higher and more favourable to the authority. No decision changed on the old one. What do you do?</p><ul><li><b>A.</b> Use the corrected figure from now on, without a notice</li><li><b>B.</b> Issue a notice within five working days, with both values and the cause in the process</li><li><b>C.</b> Correct it in next quarter's paper</li><li><b>D.</b> Issue a notice naming the analyst who released it</li></ul></li>
<li><p>A level 3 question takes 1.5 analyst days; the unit plans one review day at level 3. The deadline is in three working days, and the sponsor asks for it plus a level 2 question of 1 analyst day with half a day of review. What fits?</p><ul><li><b>A.</b> Both, with the level 3 review shortened to half a day</li><li><b>B.</b> Both: 2.5 analyst days is close enough</li><li><b>C.</b> The level 3 question alone, with its review</li><li><b>D.</b> Neither: refuse until a later board</li></ul></li>
<li><p>At the start of a scoping meeting the sponsor says: "I need the slot-booking result in a week." What is your first move?</p><ul><li><b>A.</b> Offer the two options that fit a week</li><li><b>B.</b> Agree, and work out the scope afterwards</li><li><b>C.</b> Explain at once why a week is too short for a level 3 review with its re-run</li><li><b>D.</b> Ask which decision the result informs and what evidence would convince him</li></ul></li>
<li><p>Why does a scope agreement list the questions that are out of scope?</p><ul><li><b>A.</b> So that nobody later assumes the paper answered them</li><li><b>B.</b> Because the unit's standard limits each paper to two questions</li><li><b>C.</b> To show the sponsor how much work was refused</li><li><b>D.</b> To claim the extra analysis days for the next quarter</li></ul></li>
<li><p>With twelve months of data after a change, the smallest effect the comparison can reliably detect is 0.66 hours. The operations team says the change pays only from 2 hours. Which threshold goes into the agreement?</p><ul><li><b>A.</b> 0.66 hours: the smallest detectable change</li><li><b>B.</b> 2 hours: it matters to the decision and the data can detect it</li><li><b>C.</b> 1 hour, as a compromise between the detectable change and the cost</li><li><b>D.</b> Any fall at all, as the sponsor first asked</li></ul></li>
<li><p>When should the analysis agreement, with its decision rule, be signed?</p><ul><li><b>A.</b> After the result, so the rule fits what was found</li><li><b>B.</b> After a first look at the data, to set a realistic threshold</li><li><b>C.</b> Before the analysis starts</li><li><b>D.</b> When the board paper is approved</li></ul></li>
<li><p>An agreed rule says: extend if waiting falls by at least 2 hours and no vessel type waits more than 2 hours longer. The result: a fall of 0.78 hours overall; feeders wait 6.32 hours longer. What does the rule say?</p><ul><li><b>A.</b> Extend: waiting fell overall</li><li><b>B.</b> Extend to all terminals except for feeders</li><li><b>C.</b> Re-run with a longer window until it passes</li><li><b>D.</b> Do not extend as it is: both conditions fail</li></ul></li>
<li><p>A director writes: "The subgroup table is based on very few cases; please check it before the board." Is this pressure or a challenge?</p><ul><li><b>A.</b> A challenge: it questions whether the finding is sound, and can be checked</li><li><b>B.</b> Pressure: any request from a sponsor about a finding is pressure on it, whatever it says</li><li><b>C.</b> Pressure, because it comes from a director</li><li><b>D.</b> Neither: subgroup tables are optional</li></ul></li>
<li><p>You decide to keep a subgroup result a senior asked you to remove. What must the decision record contain?</p><ul><li><b>A.</b> The decision only, so that the record stays short and easy to read</li><li><b>B.</b> The request, the checked finding, the options, the decision, its reasons and the rules cited</li><li><b>C.</b> The request and the senior's name, sent to the chief executive at once</li><li><b>D.</b> The finding with its statistical test, the count of cases and the analyst who checked it</li></ul></li>
<li><p>Which reply best keeps both the finding and the working relationship with the senior who asked to remove it?</p><ul><li><b>A.</b> The table stays: removing findings would breach our ethics and our standard, as you know</li><li><b>B.</b> I will remove it once you put the request in writing to the unit</li><li><b>C.</b> I see the concern; the agreed rule needs the table, so it stays, with context and your plan</li><li><b>D.</b> As you prefer: I will move it to an appendix at the back of the paper</li></ul></li>
<li><p>Which sentence belongs in a board quality statement about uncertainty?</p><ul><li><b>A.</b> Results should be interpreted with appropriate caution given the limitations of the data used</li><li><b>B.</b> Uncertainty was assessed by the review team</li><li><b>C.</b> The analysis used robust statistical methods</li><li><b>D.</b> The fall is likely between 0.3 and 1.3 hours per call, below the agreed 2 hours</li></ul></li>
<li><p>A released quarterly figure was understated because two weeks of an extract were loaded twice. What does the correction notice give as the cause?</p><ul><li><b>A.</b> A load that accepted duplicated weeks, and no duplicate check</li><li><b>B.</b> An unexplained data issue</li><li><b>C.</b> The analyst who ran the quarterly figure</li><li><b>D.</b> The vendor of the terminal system, which re-sent the two weeks</li></ul></li>
<li><p>True or false: a released figure that turns out to be too low, and so understated the authority's performance, needs no correction notice.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>

rd-level risk: the escalator adds one level, it does not jump to the top"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-public-statistic","title":"A simple count for a public statistic: which level?"},"level":null,"pool":"checkpoint"},{"id":"check-every-level-q1","type":"single","prompt":"Your checklist must stay short at level 1, the self-check that most dashboard requests get. Which of these items is required from level 1?","options":[{"key":"A","text":"The output is free of personal data and its classification is marked"},{"key":"B","text":"The model is tested on data it never saw"},{"key":"C","text":"A reviewer re-runs it from the repository"},{"key":"D","text":"Every number has an interval"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The harm of personal data leaving the unit does not depend on how important the analysis is, so the check cannot wait for a higher level.","misconceptions":["","Assumes every analysis is a model: the model item matters only where there is a model, at level 3","Confuses importance with risk of leakage: an independent re-run is the cost that level 2 and above pay","Treats every count as an estimate: an interval matters where the decision depends on a number, from level 2"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-every-level","title":"Which item belongs in every level?"},"level":null,"pool":"checkpoint"},{"id":"check-dangerous-failure-q1","type":"single","prompt":"A re-run of a colleague's repository meets four problems. Which one most threatens the quality of what the unit releases?","options":[{"key":"A","text":"The script crashes on a missing file"},{"key":"B","text":"An old library call fails with an error"},{"key":"C","text":"The README names the wrong file"},{"key":"D","text":"A step done by hand that no file records"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Every other failure stops the script and shows itself. A manual step lets the code run to a plausible number that nobody can reproduce or check.","misconceptions":["Ranks by how alarming the error looks: a crash stops the reviewer and announces itself","An old library call fails loudly too; pinning versions is a cheap fix, not a hidden risk","Slows the reviewer but changes no figure: a README that names the wrong file is fixed in a minute",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-dangerous-failure","title":"Which failure is most dangerous to the unit?"},"level":null,"pool":"checkpoint"},{"id":"check-restricted-data-q1","type":"single","prompt":"An analyst pastes the night pilot roster, with pilots' names and shifts, into the authority's approved hosted assistant to find fatigue risks. She plans to disclose it and re-run every number. Under the rules, what is it?","options":[{"key":"A","text":"Allowed: the tool is approved"},{"key":"B","text":"A breach: restricted data may not go to the assistant"},{"key":"C","text":"Allowed once the deliverable is disclosed"},{"key":"D","text":"Needs action: re-run the numbers first"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Names and shifts of staff are not public data; the guidelines forbid entering data classified restricted or higher, so no later step makes it allowed.","misconceptions":["Treats approval of the tool as approval of any data: the guideline limits generative AI tools to public data, whichever tool","","Believes disclosure repairs a data breach: telling readers does not undo where the data went","Confuses verification with permission: re-running the numbers checks accuracy, not whether the data could be sent"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-restricted-data","title":"An approved assistant and a restricted file"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Four requests and the level an analyst gave each, with the unit's matrix and escalators. Which one is graded right?","options":[{"key":"A","text":"A model that sets night pilot numbers: level 2, it is a simple regression"},{"key":"B","text":"A staff survey summary with personal data: level 3"},{"key":"C","text":"A dwell figure for the ministry's indicators: level 2"},{"key":"D","text":"A tariff revenue estimate for the board: level 3"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A board tariff decision is a high effect; a joined estimate is medium complexity; the matrix gives level 3 and no escalator applies.","misconceptions":["Grades the method, not the use: a staffing model that sets night pilots is a safety use, high effect and high complexity","Lets personal data raise the level: it adds the data protection officer's check, not a level","Forgets that a figure leaving the authority adds one level, even when the method is routine",""],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which request is graded right under yesterday's standard?"},"level":null,"pool":"checkpoint"},{"id":"check-kappa-q1","type":"single","prompt":"Two reviewers rate 20 findings and agree on 16 of them, 80%. Their weighted kappa is 0.3. Which explanation fits?","options":[{"key":"A","text":"The kappa was computed wrongly"},{"key":"B","text":"Most findings were rated minor by both, so much of the agreement was expected by chance"},{"key":"C","text":"Four disagreements are too many for any team"},{"key":"D","text":"Twenty findings are too few to compute kappa"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"When nearly everything is rated minor, two reviewers agree often by chance; kappa removes that, so the agreement on the rare serious findings decides it.","misconceptions":["Blames the arithmetic: kappa and percent agreement measure different things, and both can be right","","Reads kappa as a count of disagreements: four disagreements out of twenty do not by themselves give 0.3","Assumes more findings always raise kappa; kappa corrects for chance whatever the number of findings"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-kappa","title":"High agreement, low kappa: what happened?"},"level":null,"pool":"checkpoint"},{"id":"check-audit-evidence-q1","type":"single","prompt":"An analyst's assisted analysis has a disclosure line and correct figures when you recompute them, but no prompts and no verification record. He says he checked everything. What does the audit record?","options":[{"key":"A","text":"No breach: the figures are right"},{"key":"B","text":"A breach of the disclosure rule"},{"key":"C","text":"A breach of the keep rules: no prompts and no record"},{"key":"D","text":"A breach of the verify rule only"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The keep rules ask for prompts and a verification record in the repository; their absence is the breach, however right the figures turn out to be.","misconceptions":["Accepts a claim as evidence: the audit can only see what the files show","Confuses keeping records with disclosing: the disclosure line is there","","Escalates a missing record into a verification failure the audit did not find: the figures were right"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-audit-evidence","title":"\"I checked the numbers\""},"level":null,"pool":"checkpoint"},{"id":"check-specific-note-q1","type":"single","prompt":"Four feedback notes on the same finding: an average that mixed imports with transshipment.","options":[{"key":"A","text":"Cell 3 averages imports with transshipment (5.2 days); print counts by move type before every average"},{"key":"B","text":"Be more careful with the populations you average over"},{"key":"C","text":"Your dwell figure was wrong because of transshipment"},{"key":"D","text":"Read the unit's data-handling guide again this month"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the cell and the number she can check, and a concrete habit she can apply to any average.","misconceptions":["","Names a virtue instead of an action: she cannot tell what 'careful' means for her next notebook","Diagnoses without a next step: she knows what was wrong, not what to do instead","Sends her to a resource without linking it to the error she made"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-specific-note","title":"Which note will change what she does next week?"},"level":null,"pool":"checkpoint"},{"id":"check-shortfall-q1","type":"single","prompt":"Next quarter's level 3 and 4 reviews need 184 senior hours; your seniors have 150. A director asks you to \"just call some of them level 2\".","options":[{"key":"A","text":"Lower five level 3 analyses to level 2"},{"key":"B","text":"Ask the seniors to absorb the extra hours"},{"key":"C","text":"Let mid-level analysts review level 3 alone"},{"key":"D","text":"Co-sign five level 3 reviews and defer what can wait"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The level comes from the risk; co-signing keeps a senior's judgement on each level 3 review at a fifth of the hours and trains the next reviewers.","misconceptions":["Lets capacity set the level, which is how last year's under-assured requests got through","Overloads the seniors, which quietly cuts the depth of every review instead of the number","Moves the risk to whoever picks the reviews; a level 3 analysis still needs independent senior judgement",""],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-shortfall","title":"Senior hours run short: what do you do?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"You and a colleague reviewed the same analysis alone. You agree on three of six severity ratings; the largest gap, two levels, is on a privacy finding.","options":[{"key":"A","text":"Record a severity of 2 for the privacy finding"},{"key":"B","text":"Use the senior reviewer's ratings"},{"key":"C","text":"Discuss the privacy gap and add the sentence to the checklist that prevents it"},{"key":"D","text":"Discuss all three disagreements in turn"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap of two levels shows an item that admits two readings; the fix is the wording, so the next review agrees.","misconceptions":["Averages two readings of one rule and leaves the rule as ambiguous as before","Settles the case by seniority; the next pair of reviewers will split the same way","","Treats the gaps of one level as worth a meeting; calibration time goes to the large gaps"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Two reviewers agree on half their ratings. What comes next?"},"level":null,"pool":"checkpoint"},{"id":"check-deadline-cut-q1","type":"single","prompt":"You agreed option A, 4.0 days with review. The sponsor now says four days, and adds a question on feeder vessels. What do you answer?","options":[{"key":"A","text":"Keep A and add the feeder question; the team will work longer"},{"key":"B","text":"Offer B in place of A: it fits four days and answers the feeder question"},{"key":"C","text":"Drop the review to level 2 so everything fits"},{"key":"D","text":"Say the deadline cannot be met and ask for a later board"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Swapping one question for another keeps the work inside the days with its review, and answers the new question.","misconceptions":["Promises more work in the same days; the time comes out of the review the level requires","","Lowers the level to fit the diary; the level comes from what an error would cost the board","Refuses when an option exists, which costs the sponsor's trust and gives the board nothing"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-deadline-cut","title":"The deadline moves from five days to four"},"level":null,"pool":"checkpoint"},{"id":"check-threshold-q1","type":"single","prompt":"With three months of data after the change, the minimum detectable change is 1.13 hours. The sponsor wants to extend \"if waiting falls by half an hour\". What do you do?","options":[{"key":"A","text":"Sign it: the sponsor sets the threshold"},{"key":"B","text":"Use a looser test so half an hour can show"},{"key":"C","text":"Run the analysis first, then agree the threshold"},{"key":"D","text":"Show him the detectable change and agree a longer window or a threshold the data can test"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A rule is only useful if the data could meet it; more months after the change lower the detectable change.","misconceptions":["Signs a rule the data cannot test: any result will read as 'no detectable effect'","Lowers the bar for evidence to fit the wish, which is how false positives reach a board","Agrees the rule after the result, the thing the agreement exists to prevent",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-threshold","title":"A threshold the data cannot test"},"level":null,"pool":"checkpoint"},{"id":"check-pressure-q1","type":"single","prompt":"You checked the subgroup: hundreds of cases, a large effect, and its condition is in the signed decision rule. The deputy chief executive asks again to remove it. What do you do?","options":[{"key":"A","text":"Remove it and mention it in a footnote"},{"key":"B","text":"Remove it, since he outranks you"},{"key":"C","text":"Keep it, record the repeated request and escalate with the record"},{"key":"D","text":"Keep it, but leave the request out of the record"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The standard keeps findings after review and says a repeated request is escalated with the decision record, so the decision rests on process, not on rank.","misconceptions":["Changes the rule after the result was seen, the thing the agreement was signed to prevent","Lets seniority decide a question of evidence; the board is left without the condition it agreed","","Hides the disagreement from the board instead of recording it beside the finding"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-pressure","title":"A senior asks to remove an unfavourable subgroup"},"level":null,"pool":"checkpoint"},{"id":"check-correction-q1","type":"single","prompt":"A released figure is found to be wrong; the corrected value is higher and more favourable to the authority. No decision changed on the old one. What do you do?","options":[{"key":"A","text":"Use the corrected figure from now on, without a notice"},{"key":"B","text":"Issue a notice within five working days, with both values and the cause in the process"},{"key":"C","text":"Correct it in next quarter's paper"},{"key":"D","text":"Issue a notice naming the analyst who released it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The figure left the authority; whoever used it needs the notice, whatever the direction of the error.","misconceptions":["Lets the direction of the error decide whether readers are told","","Mixes a correction with the next routine release, so readers of the old figure never see it","Puts a person where the cause is a process, which discourages the next report of an error"],"lo":["LO1"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-correction","title":"The corrected figure is better news"},"level":null,"pool":"checkpoint"},{"id":"q-assure-01","type":"single","prompt":"A request: monthly tug fuel use per call, from one system, for an internal note that nobody acts on for at least a quarter. With the unit's matrix (effect by complexity) and its escalators, which level does it get?","options":[{"key":"A","text":"Level 1: a low effect and a low complexity"},{"key":"B","text":"Level 2: every analysis needs a second pair of eyes"},{"key":"C","text":"Level 3: fuel is a cost, and costs go to the board"},{"key":"D","text":"Level 2: the data come from an operational system"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An error in an internal note that changes nothing for a quarter has a low effect; one source and a routine method is low complexity, and no escalator applies.","misconceptions":["","Treats peer review as a minimum for all work, which spends review hours where an error does no harm","Grades the topic instead of the use: the note decides nothing","Takes the source system as a risk factor; the matrix asks what an error would change"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"risk-two-axes","title":"Assurance grows with the effect of an error and the complexity of the work"},"level":"apply","pool":"practice"},{"id":"q-assure-02","type":"single","prompt":"Two analysts grade the same request with your written standard. One gives level 2, the other level 3. Both used the matrix correctly. What does the difference most likely show?","options":[{"key":"A","text":"One analyst is more careful than the other"},{"key":"B","text":"A definition in the standard can be read two ways"},{"key":"C","text":"The matrix has too few levels to be useful"},{"key":"D","text":"The request should go to the head of unit to decide"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"If both applied the matrix, they graded a factor differently, which means its definition admits two readings; tightening it is the fix.","misconceptions":["Blames the person, when the standard's words allowed both readings","","Adds levels, which multiplies the boundaries where readings differ","Escalates one case and leaves the ambiguous definition in place for the next"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"definitions-matter","title":"A peer applies your words, not your intentions"},"level":"analyze","pool":"practice"},{"id":"q-assure-03","type":"single","prompt":"In a unit of twelve, the analyst who built the berth demand model is also the most senior person free to assure it. Under the four roles, what should happen?","options":[{"key":"A","text":"He assures it, since he knows the model best"},{"key":"B","text":"He approves it, and a junior analyst assures it"},{"key":"C","text":"Another senior assures it, even if that waits a week"},{"key":"D","text":"The commissioner assures it, as the person who asked"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The assurer must be independent of the analyst; knowing the model best is exactly why he cannot see its blind spots.","misconceptions":["Confuses expertise with independence: the author cannot assure his own work","Swaps the roles but keeps him signing off his own analysis","","Gives assurance to the person who wants the answer, who is not independent of it"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"four-roles","title":"Four roles, and the assurer is never the analyst"},"level":"apply","pool":"practice"},{"id":"q-check-01","type":"single","prompt":"You adapt a published 32-item checklist written for machine-learning studies. Most of the unit's work is counts and comparisons for directors. What is the best first step?","options":[{"key":"A","text":"Adopt all 32 items as they stand, so that nothing the authors found is missed"},{"key":"B","text":"Use it only for level 4 analyses"},{"key":"C","text":"Replace it with one question: is the work reproducible?"},{"key":"D","text":"Map the items to the review areas and keep those the unit's work needs"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Mapping shows which items serve the unit's areas and where nothing does (communication), so the checklist fits the work and gets used.","misconceptions":["Assumes a longer checklist is safer, when reviewers skip what does not fit","Keeps the checks from the work that needs them most often","Collapses many checks into one that two reviewers would answer differently",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"adapt-not-adopt","title":"REFORMS: 32 items in 8 modules, written for others' work"},"level":"apply","pool":"practice"},{"id":"q-check-02","type":"single","prompt":"Which checklist item can two reviewers answer the same way?","options":[{"key":"A","text":"Are excluded records counted, with a reason for each exclusion?"},{"key":"B","text":"Is the analysis rigorous?"},{"key":"C","text":"Is the data quality good enough?"},{"key":"D","text":"Would an experienced expert in the field approve of the method used?"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"It is a yes-or-no question that names its evidence (a count per exclusion step), so both reviewers look at the same thing.","misconceptions":["","Uses an adjective that each reviewer reads differently","Asks for a judgement with no named evidence, so each reviewer uses their own bar","Imports a hypothetical judge instead of something in the files"],"lo":["LO1","LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"item-shape","title":"An item is a yes-or-no question with the evidence that answers it"},"level":"understand","pool":"practice"},{"id":"q-check-03","type":"single","prompt":"A level 1 dashboard request is checked by its analyst. Which item must the self-check still include?","options":[{"key":"A","text":"An independent re-run of the analysis from its repository"},{"key":"B","text":"No personal data and the classification marked"},{"key":"C","text":"An interval on every number"},{"key":"D","text":"A second reviewer's severity ratings"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Leakage harms people whatever the level of the analysis, so the privacy and classification item applies from level 1.","misconceptions":["An independent re-run is the cost that level 2 and above pay","","Intervals matter where a decision depends on a number, from level 2","Second reviews belong to calibration and level 4, not a self-check"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"privacy-item","title":"Nothing leaves the unit before the privacy and classification check"},"level":"apply","pool":"practice"},{"id":"q-rerun-01","type":"single","prompt":"A colleague's script runs to the end on your laptop and prints 5.18 days; the report says 4.60. Nothing failed. What do you do next?","options":[{"key":"A","text":"Accept the report: the code ran without errors"},{"key":"B","text":"Accept your figure and correct the report"},{"key":"C","text":"Look for a step that happened outside the code"},{"key":"D","text":"Average the two figures and note the range"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap with no error points to a step outside the code, such as a manual exclusion, which must be found before either figure is trusted.","misconceptions":["Takes a clean run for a correct one","Trusts the re-run over the report before knowing why they differ","","Hides a discrepancy instead of explaining it"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"the-silent-gap","title":"It ran, and gave 5.18 days against the reported 4.60"},"level":"analyze","pool":"practice"},{"id":"q-rerun-02","type":"single","prompt":"Two runs of the same script give 5.08 and 5.17. Which repository rule prevents this?","options":[{"key":"A","text":"Pin every package version in a lock file"},{"key":"B","text":"Use only relative paths"},{"key":"C","text":"Name every input file and its source in the README"},{"key":"D","text":"Fix the seed of every random step in the code"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Different results from the same code and data come from randomness; a fixed seed makes the run repeatable.","misconceptions":["Versions explain a failure across machines, not two runs on one","Paths make a script fail, not vary","Documentation helps a re-run start; it does not make results repeat",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"failure-kinds","title":"One repository rule for each kind of failure"},"level":"apply","pool":"practice"},{"id":"q-rerun-03","type":"tf","prompt":"True or false: a reviewer should read the report first, so that the re-run can focus on the claims that matter.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Reading first sets expectations; re-running first tests whether the handed-over repository produces the report at all.","misconceptions":["Lets the prose decide what gets checked, which is how a fluent wrong report passes",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"rerun-rule","title":"From level 2, the reviewer re-runs the analysis before reading it"},"level":"understand","pool":"practice"},{"id":"q-rules-01","type":"single","prompt":"An analyst uses the approved assistant on anonymised berth data, keeps the prompts, and re-runs every number, but the board paper has no line saying an assistant was used. Under the rules, what is it?","options":[{"key":"A","text":"A breach of the disclosure rule"},{"key":"B","text":"Allowed: the data and the verification were right"},{"key":"C","text":"Allowed, if the reviewer knew about it"},{"key":"D","text":"A breach of the data rule"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The disclosure rule asks for a line on the deliverable itself; the board must be told, whatever else was done right.","misconceptions":["","Treats verification as a substitute for telling the readers","Confuses telling the reviewer with telling the recipients","The data were anonymised and the tool approved, so no data rule was broken"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"four-rule-kinds","title":"Verify, disclose, keep, and what data may go in"},"level":"apply","pool":"practice"},{"id":"q-rules-02","type":"single","prompt":"Which rule can a reviewer check from the files of an analysis?","options":[{"key":"A","text":"Use the assistant responsibly"},{"key":"B","text":"Keep a verification record of each assisted number"},{"key":"C","text":"Be transparent with readers about any use of AI in the work"},{"key":"D","text":"Protect sensitive data where possible"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A verification record is a file a reviewer can open; the others are intentions with no evidence behind them.","misconceptions":["States a value, not an action anyone can see done","","Names a principle without saying what shows it was met","Leaves the exception open with 'where possible'"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"checkable-rule","title":"A rule a reviewer cannot check from the files is a wish"},"level":"understand","pool":"practice"},{"id":"q-rules-03","type":"single","prompt":"Why does the unit's rule set include one analysis a quarter done without an assistant?","options":[{"key":"A","text":"To measure how much time the assistant saves"},{"key":"B","text":"Because the national guidelines forbid assistants for analysis"},{"key":"C","text":"To keep the skill needed to check the assistant"},{"key":"D","text":"To give the reviewers a lighter quarter"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Verification needs the skill the assistant replaces; unaided work keeps it alive.","misconceptions":["Turns a skill rule into a productivity study","Overstates the guidelines, which set conditions for use, not a ban","","Unaided work is reviewed like any other, so it saves no review time"],"lo":["LO3","LO4"],"day":1,"session":4,"slide":{"deck":"day1","id":"unaided-practice","title":"Who cannot do the work unaided cannot tell when the draft is wrong"},"level":"understand","pool":"practice"},{"id":"q-calib-01","type":"single","prompt":"A draft names vessel masters and their mobile numbers in a table. Fixing it changes no figure and no recommendation. Under the unit's severity scale, how is it rated?","options":[{"key":"A","text":"Not a finding: it is the data protection officer's matter"},{"key":"B","text":"Minor: it is presentation, like a label"},{"key":"C","text":"Major: personal data is serious but the decision stands"},{"key":"D","text":"Critical: the output cannot leave the unit as it is"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The scale makes a finding critical when the decision changes or when the output cannot leave the unit; personal data in an output is the second case.","misconceptions":["Hands the finding to someone else instead of rating it; the reviewer still blocks the release","Rates by the effect on the numbers only and forgets the clause about release","Invents a middle rating for findings that feel serious but leave the numbers alone",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"severity-scale","title":"Rate a finding by what it does to the decision, not by how you found it"},"level":"apply","pool":"practice"},{"id":"q-calib-02","type":"single","prompt":"Fixing one flaw moves an estimated effect from -5.36 hours to -1.37; the draft recommends action only at -2 hours or more. Fixing a second flaw moves it on to -0.94. How do the two flaws rate?","options":[{"key":"A","text":"First critical, second major"},{"key":"B","text":"First major, second critical: the second leaves the smaller effect"},{"key":"C","text":"Both critical: both move the estimate"},{"key":"D","text":"Both major: neither alone gives the final figure"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The first fix alone takes the effect below the decision threshold, so the decision changes; the second changes the size, not the decision.","misconceptions":["","Rates by the final figure, not by what each fix does to the decision","Treats any change in the estimate as critical, so the scale stops separating findings","Asks each flaw to explain the whole gap, which no single flaw has to do"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"fix-one-at-a-time","title":"Fix a flaw and re-run: the decision flips on C1"},"level":"analyze","pool":"practice"},{"id":"q-calib-03","type":"single","prompt":"Two reviewers rate the same six findings and differ by two levels on one of them. What should the calibration session produce?","options":[{"key":"A","text":"An average of the two ratings for that finding"},{"key":"B","text":"A sentence added to the checklist that would have prevented the gap"},{"key":"C","text":"A note in the review file that the two reviewers see the finding differently"},{"key":"D","text":"The senior reviewer's rating, recorded as final"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A large gap shows a checklist item that admits two readings; changing its wording is what makes the next review agree.","misconceptions":["Splits the difference, which is right for neither reading","","Records the disagreement without changing anything that caused it","Settles one case by seniority and leaves the ambiguity for the next"],"lo":["LO1","LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"disagreement-to-wording","title":"Each big gap becomes a sentence in the checklist"},"level":"apply","pool":"practice"},{"id":"q-audit-01","type":"single","prompt":"An assisted analysis used the approved assistant, re-ran every number and disclosed the use. The data sent to the assistant were the names and shifts of pilots. What does the audit record?","options":[{"key":"A","text":"No breach: the work was verified and disclosed"},{"key":"B","text":"A breach of the disclosure rule, since the pilots were never told their data were used"},{"key":"C","text":"A breach of the data rule; tell the data protection officer and redo on anonymised data"},{"key":"D","text":"A minor note for the analyst's feedback"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Restricted personal data left the authority's control; verification and disclosure do not undo that, and the officer must be told.","misconceptions":["Lets right figures and an honest disclosure excuse what was sent","The use was disclosed; the problem is what the assistant was given","","Downgrades a data breach to a development point"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"breach-table","title":"Each breach is recorded with the rule it breaks and the action it needs"},"level":"apply","pool":"practice"},{"id":"q-audit-02","type":"single","prompt":"An assisted analysis reports 18.4% and has no verification record. You recompute 47.7% from the authority's data. What action does the audit table record?","options":[{"key":"A","text":"Correct the figure to 47.7% in the released paper and tell its readers"},{"key":"B","text":"Ask the analyst to add a verification record"},{"key":"C","text":"Note it for the next quarter's audit"},{"key":"D","text":"Withdraw the figure, then re-run and re-review the analysis"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A released figure that the data contradict must be withdrawn; the auditor's recomputation is a check, not a reviewed replacement.","misconceptions":["Releases the auditor's own number without the review the original lacked","Adds paperwork to a figure already known to be wrong","Leaves a wrong figure in circulation for a quarter",""],"lo":["LO3","LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"recompute","title":"A3 says 18.4%; the authority's own data say 47.7%"},"level":"apply","pool":"practice"},{"id":"q-audit-03","type":"single","prompt":"An audit of five assisted analyses finds two with no verification record. What is the best change to propose?","options":[{"key":"A","text":"No review of assisted work starts without its verification record"},{"key":"B","text":"Warn the two analysts in writing"},{"key":"C","text":"Ban the assistant until the next audit"},{"key":"D","text":"Audit every assisted analysis from now on, not a sample of five"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two of five points at the process: making the record a condition of review catches it every time, before release.","misconceptions":["","Treats a process gap as two personal failings, which teaches the unit to hide assistant use","Removes a tool the rules already allow with conditions","Multiplies audit hours instead of fixing the step that let the gap through"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"audit-to-rule","title":"Two of five had no verification record: change the process, not just the analyses"},"level":"evaluate","pool":"practice"},{"id":"q-feedback-01","type":"single","prompt":"A reviewer found seven things in a new analyst's notebook, from a missing comparison group to variable names. How many should the feedback conversation raise?","options":[{"key":"A","text":"All seven of them, so that nothing is hidden from her"},{"key":"B","text":"About three that show a pattern in her reasoning"},{"key":"C","text":"None: send the review notes instead"},{"key":"D","text":"Only the most severe one"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Three findings that share a reasoning gap are what she can remember and act on; the rest stay in the review notes.","misconceptions":["Confuses the review of the analysis with feedback to the person","","Notes tell her what was wrong, not how to reason next time","Leaves out patterns she needs to see together"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"seven-to-three","title":"Seven findings is a review; three is feedback"},"level":"apply","pool":"practice"},{"id":"q-feedback-02","type":"single","prompt":"Which part of a feedback note does most to build an analyst's skill on a new problem?","options":[{"key":"A","text":"The observation: the cell and the number"},{"key":"B","text":"The effect of the error on the decision the analysis informed"},{"key":"C","text":"The reasoning: the question she did not ask herself"},{"key":"D","text":"The praise that opens the note"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The reasoning line names a question she can ask on any future problem; the other parts are tied to this notebook.","misconceptions":["Locates this error but does not carry to the next problem","Shows why it mattered here without saying how to avoid it","","Helps the tone but teaches nothing unless it is specific"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"four-parts","title":"Observation, effect, reasoning, next step"},"level":"understand","pool":"practice"},{"id":"q-feedback-03","type":"single","prompt":"A new analyst's lowest skill is verifying assisted work. Why does her three-month plan end with an analysis done without the assistant?","options":[{"key":"A","text":"To measure how fast she is without it"},{"key":"B","text":"Because juniors may not use the assistant"},{"key":"C","text":"To give her reviewer a simpler analysis"},{"key":"D","text":"She cannot check work she cannot do herself"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Verifying an assistant's output needs the skill it replaces; unaided work builds and shows that skill.","misconceptions":["Turns a skill goal into a speed test","The rules allow juniors to use the approved assistant with conditions","Unaided work is reviewed at its normal level",""],"lo":["LO4","LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"unaided-in-plan","title":"An analyst who checks assistants must still do the work alone"},"level":"understand","pool":"practice"},{"id":"q-rota-01","type":"single","prompt":"Level 3 reviews take 10 senior hours and level 4 reviews 16, plus a second reviewer. Next quarter has 12 level 3 and 4 level 4 analyses. How many senior hours do they need?","options":[{"key":"A","text":"184 hours"},{"key":"B","text":"152 hours"},{"key":"C","text":"120 hours"},{"key":"D","text":"216 hours"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"12 × 10 + 4 × 16 = 184; the second reviewer's hours need not be a senior's.","misconceptions":["","Counts level 4 at the level 3 rate","Leaves out the level 4 reviews","Charges the second reviewers' hours to the seniors as well"],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"levels-to-hours","title":"Assurance levels turn into review hours"},"level":"apply","pool":"practice"},{"id":"q-rota-02","type":"single","prompt":"A co-signed level 3 review has a mid-level analyst review and a senior check the review in 2 hours, in place of 10. How many co-signed reviews close a senior shortfall of 34 hours?","options":[{"key":"A","text":"Four"},{"key":"B","text":"Five"},{"key":"C","text":"Seventeen"},{"key":"D","text":"Three"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each co-signed review saves 8 senior hours; four save 32, short of 34, so five are needed.","misconceptions":["Rounds down and leaves the rota 2 hours short","","Divides by the 2 co-sign hours instead of the 8 saved","Divides by 10, as if the senior spent nothing on a co-signed review"],"lo":["LO1"],"day":2,"session":4,"slide":{"deck":"day2","id":"close-the-gap","title":"Close the gap without lowering a level"},"level":"apply","pool":"practice"},{"id":"q-rota-03","type":"tf","prompt":"True or false: a rota where two seniors end at 100% of their review hours is ready for the quarter.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It keeps every rule but has no slack: an urgent level 3 request has nowhere to go, so the plan should say what moves when one arrives.","misconceptions":["Takes a rota that fits on paper for one that survives the quarter",""],"lo":["LO1","LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"the-rota","title":"Every rule kept: Faleh and Saleh end at full capacity"},"level":"evaluate","pool":"practice"},{"id":"q-scope-01","type":"single","prompt":"A level 3 question takes 1.5 analyst days; the unit plans one review day at level 3. The deadline is in three working days, and the sponsor asks for it plus a level 2 question of 1 analyst day with half a day of review. What fits?","options":[{"key":"A","text":"Both, with the level 3 review shortened to half a day"},{"key":"B","text":"Both: 2.5 analyst days is close enough"},{"key":"C","text":"The level 3 question alone, with its review"},{"key":"D","text":"Neither: refuse until a later board"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The level 3 question needs 2.5 days with its review and fits; adding the level 2 question with its review makes 4 days, so the second question becomes an option for later.","misconceptions":["Cuts the review the level requires to fit the diary","Sizes the analysis without its review and overruns the deadline","","Refuses when an option fits"],"lo":["LO5","LO1"],"day":3,"session":1,"slide":{"deck":"day3","id":"size-with-review","title":"The review is part of the time, not something after it"},"level":"apply","pool":"practice"},{"id":"q-scope-02","type":"single","prompt":"At the start of a scoping meeting the sponsor says: \"I need the slot-booking result in a week.\" What is your first move?","options":[{"key":"A","text":"Offer the two options that fit a week"},{"key":"B","text":"Agree, and work out the scope afterwards"},{"key":"C","text":"Explain at once why a week is too short for a level 3 review with its re-run"},{"key":"D","text":"Ask which decision the result informs and what evidence would convince him"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision and the evidence he would accept change which option is best; offering before asking sizes the wrong request.","misconceptions":["Offers before knowing what the result is for","Promises a scope nobody has sized","Opens with a refusal before knowing what is needed",""],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"ask-before-offer","title":"Ask four things before offering anything"},"level":"apply","pool":"practice"},{"id":"q-scope-03","type":"single","prompt":"Why does a scope agreement list the questions that are out of scope?","options":[{"key":"A","text":"So that nobody later assumes the paper answered them"},{"key":"B","text":"Because the unit's standard limits each paper to two questions"},{"key":"C","text":"To show the sponsor how much work was refused"},{"key":"D","text":"To claim the extra analysis days for the next quarter"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Writing what is out, and when it comes, stops readers and the sponsor from taking silence for an answer.","misconceptions":["","Invents a rule; the limit is the days, not a count of questions","Turns a record into a complaint","Confuses a scope record with capacity planning"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"scope-record","title":"The scope agreement records what is out as clearly as what is in"},"level":"understand","pool":"practice"},{"id":"q-agree-01","type":"single","prompt":"With twelve months of data after a change, the smallest effect the comparison can reliably detect is 0.66 hours. The operations team says the change pays only from 2 hours. Which threshold goes into the agreement?","options":[{"key":"A","text":"0.66 hours: the smallest detectable change"},{"key":"B","text":"2 hours: it matters to the decision and the data can detect it"},{"key":"C","text":"1 hour, as a compromise between the detectable change and the cost"},{"key":"D","text":"Any fall at all, as the sponsor first asked"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The threshold comes from the decision (2 hours pays for the scheme); the detectable change only confirms the data can test it.","misconceptions":["Takes the data's precision as the decision's threshold","","Splits the difference with no reason in the decision","Writes a rule any noise could meet"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"mdc","title":"With 12 months after the change, the data can detect 0.66 hours"},"level":"apply","pool":"practice"},{"id":"q-agree-02","type":"single","prompt":"When should the analysis agreement, with its decision rule, be signed?","options":[{"key":"A","text":"After the result, so the rule fits what was found"},{"key":"B","text":"After a first look at the data, to set a realistic threshold"},{"key":"C","text":"Before the analysis starts"},{"key":"D","text":"When the board paper is approved"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A rule signed before the result cannot be bent to it; any later change is dated and signed again.","misconceptions":["Fits the rule to the result, which makes it no rule","A first look at the outcome already informs the threshold","","Signs it when it can no longer guide anything"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"rule-before-result","title":"Agree what result would change the decision before anyone sees it"},"level":"understand","pool":"practice"},{"id":"q-agree-03","type":"single","prompt":"An agreed rule says: extend if waiting falls by at least 2 hours and no vessel type waits more than 2 hours longer. The result: a fall of 0.78 hours overall; feeders wait 6.32 hours longer. What does the rule say?","options":[{"key":"A","text":"Extend: waiting fell overall"},{"key":"B","text":"Extend to all terminals except for feeders"},{"key":"C","text":"Re-run with a longer window until it passes"},{"key":"D","text":"Do not extend as it is: both conditions fail"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The fall is below 2 hours and one type loses more than 2 hours; the rule's alternative applies: keep at T2 and fix the feeder slots.","misconceptions":["Reads the sign of the effect and ignores the threshold","Invents a partial option the agreement does not contain","Changes the data window after seeing the result",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"the-estimate","title":"Waiting fell 0.78 hours; feeders wait 6.32 hours longer"},"level":"apply","pool":"practice"},{"id":"q-press-01","type":"single","prompt":"A director writes: \"The subgroup table is based on very few cases; please check it before the board.\" Is this pressure or a challenge?","options":[{"key":"A","text":"A challenge: it questions whether the finding is sound, and can be checked"},{"key":"B","text":"Pressure: any request from a sponsor about a finding is pressure on it, whatever it says"},{"key":"C","text":"Pressure, because it comes from a director"},{"key":"D","text":"Neither: subgroup tables are optional"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"It questions the evidence, not its visibility; recompute and report the count, and the finding may change.","misconceptions":["","Treats every question as an attack, which shuts out fair corrections","Judges the request by rank instead of content","Treats a finding the rule depends on as decoration"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"challenge-or-pressure","title":"Is it a challenge to the finding, or pressure on it?"},"level":"analyze","pool":"practice"},{"id":"q-press-02","type":"single","prompt":"You decide to keep a subgroup result a senior asked you to remove. What must the decision record contain?","options":[{"key":"A","text":"The decision only, so that the record stays short and easy to read"},{"key":"B","text":"The request, the checked finding, the options, the decision, its reasons and the rules cited"},{"key":"C","text":"The request and the senior's name, sent to the chief executive at once"},{"key":"D","text":"The finding with its statistical test, the count of cases and the analyst who checked it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Someone who was not there must see why: what was asked, what was checked, what was weighed and on what rules.","misconceptions":["Leaves the reasons out, so the decision cannot be defended later","","Makes the record about a person, not the decision","Records the evidence but not the decision taken on it"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"decision-record","title":"Record the decision the same day, with its reasons and references"},"level":"understand","pool":"practice"},{"id":"q-press-03","type":"single","prompt":"Which reply best keeps both the finding and the working relationship with the senior who asked to remove it?","options":[{"key":"A","text":"The table stays: removing findings would breach our ethics and our standard, as you know"},{"key":"B","text":"I will remove it once you put the request in writing to the unit"},{"key":"C","text":"I see the concern; the agreed rule needs the table, so it stays, with context and your plan"},{"key":"D","text":"As you prefer: I will move it to an appendix at the back of the paper"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It acknowledges him, keeps the finding on the rule he agreed to, and gives him something to add rather than lose.","misconceptions":["Right decision, but lectures and gives him nothing to do","Trades the finding for paperwork","","Hides the finding while appearing to keep it"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"the-reply","title":"Keep the relationship and the finding"},"level":"evaluate","pool":"practice"},{"id":"q-quality-01","type":"single","prompt":"Which sentence belongs in a board quality statement about uncertainty?","options":[{"key":"A","text":"Results should be interpreted with appropriate caution given the limitations of the data used"},{"key":"B","text":"Uncertainty was assessed by the review team"},{"key":"C","text":"The analysis used robust statistical methods"},{"key":"D","text":"The fall is likely between 0.3 and 1.3 hours per call, below the agreed 2 hours"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A range set beside the agreed threshold lets the board weigh the result without the method.","misconceptions":["Warns without saying how much","Says uncertainty was looked at, not what it is","Describes the method, not what remains uncertain",""],"lo":["LO1"],"day":3,"session":4,"slide":{"deck":"day3","id":"uncertainty-number","title":"\"Results may vary\" cannot be weighed; \"between 0.3 and 1.3 hours\" can"},"level":"apply","pool":"practice"},{"id":"q-quality-02","type":"single","prompt":"A released quarterly figure was understated because two weeks of an extract were loaded twice. What does the correction notice give as the cause?","options":[{"key":"A","text":"A load that accepted duplicated weeks, and no duplicate check"},{"key":"B","text":"An unexplained data issue"},{"key":"C","text":"The analyst who ran the quarterly figure"},{"key":"D","text":"The vendor of the terminal system, which re-sent the two weeks"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The notice names the cause in the process and the change that prevents it, so the next error gets reported.","misconceptions":["","Gives no cause, so no process changes","Blames a person, which teaches the unit to hide errors","Moves the blame outside and leaves the unit's missing check in place"],"lo":["LO1","LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"correction-notice","title":"A correction names the process, not the person"},"level":"apply","pool":"practice"},{"id":"q-quality-03","type":"tf","prompt":"True or false: a released figure that turns out to be too low, and so understated the authority's performance, needs no correction notice.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The figure left the authority and others used it; whatever the direction of the error, they are told.","misconceptions":["Lets the direction of the error decide whether readers are told",""],"lo":["LO1"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-correction","title":"The corrected figure is better news"},"level":"understand","pool":"practice"}]}</script>
